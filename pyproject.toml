[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jino-domains-sdk"
version = "0.2.1"
description = "Direct HTTP Python SDK for Jino domain management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx[http2,brotli,zstd]>=0.27,<1"]

[project.scripts]
jino = "jino_domains_sdk.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["jino_domains_sdk*"]
